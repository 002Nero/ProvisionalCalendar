name: Laravel

on:
  push:
    branches: [ "refactor", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker containers
      run: docker compose build

    - name: Copy .env
      run: docker compose run --rm laravel-app sh -c "cp .env.example .env || true"

    - name: Install dependencies (Composer inside Docker)
      run: docker compose run --rm laravel-app composer install --no-interaction --prefer-dist

    - name: Generate app key
      run: docker compose run --rm laravel-app php artisan key:generate

    - name: Set permissions
      run: docker compose run --rm laravel-app chmod -R 777 storage bootstrap/cache

    - name: Create SQLite database
      run: |
        docker compose run --rm laravel-app sh -c "
          mkdir -p database &&
          touch database/database.sqlite
        "

    - name: Run tests
      run: docker compose run --rm laravel-app php artisan test
